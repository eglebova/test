# Replace example.ru and certificate paths before enabling this server block.
# Upload only the CONTENTS of dist/ into /var/www/glebova-site/current.
server {
    listen 80;
    listen [::]:80;
    server_name example.ru www.example.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/glebova-site/current;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.ru www.example.ru;

    root /var/www/glebova-site/current;
    index index.html;
    autoindex off;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src 'none'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; frame-src 'none'; media-src 'none'; manifest-src 'self'; upgrade-insecure-requests" always;
    # Enable HSTS only after HTTPS works for every used subdomain:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ~* (^|/)\. { deny all; }
    location ~* \.(?:md|markdown|ya?ml|toml|ini|log|sql|dump|bak|old|orig|swp|map|env|conf|pem|key|crt|sh|py|zip)$ { deny all; }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # Nginx index module serves /section/ as /section/index.html and
    # redirects /section to /section/ when a directory index is present.
    location / {
        try_files $uri $uri/ =404;
    }
}
