name: One-time branch cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-branch-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the triggering main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Delete obsolete branches and verify
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for branch in \
            audit-implementation-2026-11 \
            feature/full-site-redesign \
            site-audit-implementation-2026-11
          do
            echo "Deleting $branch"
            gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch"
          done

          remaining="$(gh api "repos/$GH_REPO/branches?per_page=100" --jq '.[].name')"
          printf 'Remaining branches:\n%s\n' "$remaining"
          if [ "$remaining" != "main" ]; then
            echo "Unexpected branch list; refusing to remove this workflow."
            exit 1
          fi

      - name: Remove the temporary cleanup workflow from main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-branch-cleanup.yml
          git commit -m "Remove one-time branch cleanup workflow"
          git push origin HEAD:refs/heads/main
